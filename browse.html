<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0e3d2f">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>題庫瀏覽 | 考古題練習室</title>
  <link rel="stylesheet" href="css/style.css?v=20261005d">
</head>

<body>
  <div class="container fade-in">
    <div class="back-link" onclick="location.href='index.html'">← 返回主選單</div>

    <!-- 考試類別切換列（由 js/tracks.js 的 TRACKS 產生） -->
    <nav class="track-switcher-wrap" id="trackSwitcher" aria-label="考試類別" style="margin-top: 10px;"></nav>

    <div class="page-header page-header-compact">
      <h1>題庫內容瀏覽</h1>
      <p class="subtitle">先從題庫書架挑一份，再檢查題目、答案與解析。</p>
    </div>

    <div class="card browse-library mb-16">
      <div class="settings-head">
        <div>
          <div class="section-kicker">Library</div>
          <label>題庫書架</label>
          <div class="settings-hint">可依題庫系列、科目或關鍵字快速找到要檢查的題庫。</div>
        </div>
        <div class="selected-pill" id="browseSummary">載入中...</div>
      </div>

      <input id="browseSearch" class="bank-search" type="search" placeholder="搜尋年份、科目、來源，例如 112、會計、統測...">
      <div class="filter-label">題庫系列</div>
      <div class="collection-grid" id="browseSourceFilters"></div>
      <div class="filter-label">科目</div>
      <div class="filter-row" id="browseSubjectFilters"></div>
      <div id="browseBankList" class="bank-list browse-bank-list">
        <div class="text-dim">題庫載入中...</div>
      </div>
    </div>

    <div class="card browse-current mb-16" id="browseCurrent">
      <div class="settings-head">
        <div>
          <div class="section-kicker">Preview</div>
          <h2 id="currentBankTitle">尚未選擇題庫</h2>
          <p class="text-dim">目前共 <strong id="count">0</strong> 題，顯示正確答案與說明。</p>
        </div>
        <button id="copyAllBtn" class="btn btn-secondary" onclick="copyAllBrowse(this)" disabled>📋 複製此題庫文字</button>
      </div>
      <div id="browseStatFilter" style="display:none">
        <div class="stat-filter-row">
          <span>只顯示：累計答錯 ≥</span>
          <input id="bMinWrong" class="number-input stat-num-input" type="number" min="1" step="1" placeholder="不限" inputmode="numeric" oninput="renderBrowseList()">
          <span>次，且正確率低於</span>
          <input id="bMaxAcc" class="number-input stat-num-input" type="number" min="1" max="100" step="1" placeholder="不限" inputmode="numeric" oninput="renderBrowseList()">
          <span>%（留空＝不限）</span>
        </div>
        <div class="scope-hint">與題目上的「作答 N 次 · 對 X／錯 Y」同口徑（跳過不計，後來答對過仍算錯過）；設定答錯次數時會排除沒作答過的題。「複製此題庫文字」只會包含篩選後顯示的題目。</div>
      </div>
    </div>

    <div id="list">
      <div class="empty-state">請先從上方題庫書架選擇一份題庫。</div>
    </div>
  </div>

  <script src="js/core.js?v=20261005d"></script>
  <script src="js/tracks.js?v=20261005d"></script>
  <script src="js/progress.js?v=20261005d"></script>
  <script src="js/question-view.js?v=20261005d"></script>
  <script>
    let ALL_BANKS = [];
    let browseBanks = [];        // 目前分流的題庫
    let browseQ = [];            // 目前題庫的全部題目
    let browseVisibleQ = [];     // 套用統計門檻後顯示的題目
    let currentBankFile = '';

    const $ = id => document.getElementById(id);

    const shelf = new BankShelf({
      els: { search: $('browseSearch'), collections: $('browseSourceFilters'), subjects: $('browseSubjectFilters') },
      onChange: renderBrowseBankBrowser,
    });

    $('browseBankList').addEventListener('click', e => {
      const card = e.target.closest('[data-file]');
      if (card) loadBank(card.dataset.file);
    });

    function resetPreview() {
      browseQ = [];
      browseVisibleQ = [];
      currentBankFile = '';
      $('currentBankTitle').textContent = '尚未選擇題庫';
      $('count').textContent = '0';
      $('copyAllBtn').disabled = true;
      $('browseStatFilter').style.display = 'none';
      $('list').innerHTML = '<div class="empty-state">請先從上方題庫書架選擇一份題庫。</div>';
    }

    function applyTrackFilter() {
      browseBanks = ALL_BANKS.filter(isBankInActiveTrack);
      shelf.reset(browseBanks);
      renderBrowseBankBrowser();
    }

    function currentBank() {
      return browseBanks.find(bank => bank.file === currentBankFile);
    }

    function copyBrowse(idx) {
      copyText(buildBrowsePrompt(browseVisibleQ[idx]), $(`cpbtn-${idx}`));
    }

    function copyAllBrowse(btn) {
      if (!browseVisibleQ.length || !currentBankFile) {
        showToast('請先選擇一份題庫');
        return;
      }
      const bank = currentBank();
      const header = `以下為「${bank ? bankTitle(bank) : '目前題庫'}」共 ${browseVisibleQ.length} 題題目內容：\n請根據這些內容回答問題，若有正確答案與說明請依照對應格式呈現。`;
      copyText(buildBatchPrompt(header, browseVisibleQ.map(q => buildBrowsePrompt(q, { searchHint: false }))), btn);
    }

    // 依「累計答錯次數／正確率」門檻重篩目前題庫的題目清單
    function renderBrowseList() {
      const p = parseStatFilterInputs($('bMinWrong').value, $('bMaxAcc').value);
      browseVisibleQ = browseQ.filter(q => matchesStatFilter(getQuestionStats(q._bank, q.id), p.minWrong, p.maxAccPct));

      const isFiltered = p.minWrong > 0 || p.maxAccPct !== null;
      $('count').textContent = isFiltered ? `${browseVisibleQ.length} / ${browseQ.length}` : browseQ.length;
      $('copyAllBtn').disabled = !browseVisibleQ.length;
      $('list').innerHTML = browseVisibleQ.length
        ? browseVisibleQ.map((q, i) => buildReviewItemHTML(q, { idx: i, mode: 'browse' })).join('')
        : '<div class="empty-state">沒有符合篩選門檻的題目，可調低答錯次數或放寬正確率上限。</div>';
    }

    function renderBrowseBankBrowser() {
      shelf.render();
      const visible = shelf.visibleBanks();
      $('browseSummary').textContent = `共 ${visible.length} 份 / ${sumQuestionCount(visible)} 題`;
      $('browseBankList').innerHTML = visible.length
        ? visible.map(bank => bankCardHTML(bank, { selected: bank.file === currentBankFile })).join('')
        : '<div class="empty-state">找不到符合條件的題庫。</div>';
    }

    async function loadBank(file) {
      const bank = browseBanks.find(b => b.file === file);
      if (!bank) return;
      currentBankFile = file;
      renderBrowseBankBrowser();
      try {
        const questions = await fetchJson(file);
        if (currentBankFile !== file) return; // 載入途中又點了別份
        browseQ = questions.map(q => ({ ...q, _bank: file }));
        browseQ.forEach(applyQuestionOverrides);
        $('currentBankTitle').textContent = bankTitle(bank);
        $('browseStatFilter').style.display = 'block';
        renderBrowseList();
      } catch (e) {
        console.error(e);
        showToast('無法讀取題庫內容');
      }
    }

    async function init() {
      const [banks] = await Promise.all([loadBankIndex(), initOverrides()]);
      if (!banks.length) showToast('題庫索引讀取失敗');
      ALL_BANKS = banks;

      // 網址指定題庫時切到該題庫的分流；否則沿用目前分流（沒選過則用預設）
      const target = ALL_BANKS.find(bank => bank.file === new URLSearchParams(location.search).get('bank'));
      setSelectedTrack(target ? bankTrackId(target) : (getSelectedTrack() || DEFAULT_TRACK_ID));
      renderTrackSwitcher($('trackSwitcher'), () => {
        resetPreview();
        applyTrackFilter();
      });
      applyTrackFilter();

      if (target) {
        shelf.focus(target);
        await loadBank(target.file);
      }
    }

    init();
  </script>
</body>

</html>
